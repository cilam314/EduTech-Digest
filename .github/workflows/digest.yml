name: EduTech Digest

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/digest.yml'
  workflow_dispatch:
    inputs:
      account_limit:
        description: "试运行填3；正式运行填27"
        required: true
        default: "27"
        type: choice
        options:
          - "3"
          - "27"
      search_test_provider:
        description: "正常运行选auto；另两项只用于验证星火备用搜索"
        required: true
        default: "auto"
        type: choice
        options:
          - "auto"
          - "spark-x2.5-4b"
          - "spark-x2.5-1.7b"
  schedule:
    # UTC 01:00 = 北京时间09:00。每周日、一、三、五运行，可能受GitHub调度影响延迟。
    - cron: '0 1 * * 0,1,3,5'

permissions:
  contents: write

concurrency:
  group: edutech-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check date filtering and deduplication
        run: python -m unittest discover -s tests -v
      - name: Generate digest
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SPARK_API_KEY: ${{ secrets.SPARK_API_KEY }}
          SEARCH_TEST_PROVIDER: ${{ inputs.search_test_provider || 'auto' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
          ACCOUNT_LIMIT: ${{ inputs.account_limit || '27' }}
          PYTHONUTF8: '1'
          PUBLIC_WECHAT_INDEX_URL: 'https://yaoverse.top'
        run: python scripts/run_digest.py --limit "$ACCOUNT_LIMIT"
      - name: Save reports and deduplication state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- reports/ state/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update education technology digest [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Upload report backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edutech-digest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/
            state/
          retention-days: 30
          if-no-files-found: ignore
      - name: Flag partial provider failures
        run: |
          python -c "import json; from pathlib import Path; s=json.loads(Path('state/latest_status.json').read_text(encoding='utf-8')); print('Included:',s['included']); raise SystemExit(1 if s['failed'] else 0)"
